<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Maxwell Wave Lab — 3D</title>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
  <!-- Plotly.js подключается напрямую в браузере, без Python-пакета -->
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1rem;
      background: #0f1115;
      color: #e6e6e6;
    }
    h1 {
      font-weight: 400;
      border-bottom: 1px solid #333;
      padding-bottom: .5rem;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.2rem;
      margin: 1.5rem 0;
    }
    label {
      display: flex;
      flex-direction: column;
      gap: .3rem;
      font-size: .9rem;
      color: #aaa;
    }
    input[type=range] { width: 100%; }
    .value {
      color: #7dd3fc;
      font-variant-numeric: tabular-nums;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: .7rem 1.5rem;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 1rem;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #333; cursor: wait; }
    #status {
      margin: .5rem 0 1rem;
      color: #fbbf24;
      font-size: .9rem;
      min-height: 1.2em;
    }
    #plot {
      background: white;
      border-radius: 8px;
      padding: .5rem;
      min-height: 500px;
    }
    .hint {
      color: #888;
      font-size: .85rem;
      margin-top: .5rem;
    }
  </style>
</head>
<body>

<h1>⚡ Maxwell Wave Lab — 3D</h1>
<p style="color:#aaa">
  Плоская электромагнитная волна. Крутите ползунки — Python считает поля, Plotly рисует 3D.
</p>

<div class="controls">
  <label>Частота f, ТГц <span class="value" id="fVal">500</span>
    <input type="range" id="freq" min="100" max="1000" value="500" step="10">
  </label>
  <label>Амплитуда E₀, В/м <span class="value" id="eVal">1.0</span>
    <input type="range" id="amp" min="0.1" max="2" value="1.0" step="0.1">
  </label>
  <label>Фаза E–B, ° <span class="value" id="phVal">0</span>
    <input type="range" id="phase" min="0" max="180" value="0" step="10">
  </label>
  <label>Показатель преломления n <span class="value" id="nVal">1.0</span>
    <input type="range" id="n" min="1" max="3" value="1.0" step="0.05">
  </label>
</div>

<button id="runBtn" onclick="updatePlot()" disabled>Загрузка Python…</button>
<div id="status"></div>
<div id="plot"></div>
<div class="hint">Вращение: зажмите левую кнопку мыши. Зум: колесо мыши.</div>

<script>
let pyodideReady = false;
let pyodide = null;

async function main() {
  document.getElementById('status').textContent = 'Загрузка Pyodide (первый раз ~10–20 сек)…';
  pyodide = await loadPyodide();
  // Загружаем только numpy, plotly больше не нужен
  await pyodide.loadPackage(['numpy']);
  pyodideReady = true;
  document.getElementById('status').textContent = 'Готово. Двигайте ползунки и нажимайте кнопку.';
  document.getElementById('runBtn').disabled = false;
  document.getElementById('runBtn').textContent = 'Обновить график';

  ['freq','amp','phase','n'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => {
      document.getElementById('fVal').textContent = document.getElementById('freq').value;
      document.getElementById('eVal').textContent = document.getElementById('amp').value;
      document.getElementById('phVal').textContent = document.getElementById('phase').value;
      document.getElementById('nVal').textContent = document.getElementById('n').value;
    });
  });

  updatePlot(); // первый расчёт
}

async function updatePlot() {
  if (!pyodideReady) return;
  const btn = document.getElementById('runBtn');
  btn.disabled = true;
  document.getElementById('status').textContent = 'Считаем…';

  const freq = parseFloat(document.getElementById('freq').value);
  const amp = parseFloat(document.getElementById('amp').value);
  const phaseDeg = parseFloat(document.getElementById('phase').value);
  const n = parseFloat(document.getElementById('n').value);

  // Python-код: только вычисления, возвращает JSON-строку с массивами
  const pythonCode = `
import numpy as np
import json

f = ${freq} * 1e12
E0 = ${amp}
phase = np.deg2rad(${phaseDeg})
n = ${n}

c = 3e8
v = c / n
lam = c / f / n

z = np.linspace(0, 2 * lam, 400)
k = 2 * np.pi / lam
omega = 2 * np.pi * f
t = 0

E = E0 * np.cos(k * z - omega * t)
B = (E0 / v) * np.cos(k * z - omega * t + phase)
B_plot = B * v  # нормируем для наглядности

# Возвращаем всё как JSON-строку, чтобы JS легко распарсил
result = {
    'z': z.tolist(),
    'E': E.tolist(),
    'B': B_plot.tolist(),
    'lam': float(lam)
}
json.dumps(result)
  `;

  try {
    const resultJson = await pyodide.runPythonAsync(pythonCode);
    const data = JSON.parse(resultJson);

    // Строим 3D-график нативно через Plotly.js
    const traceE = {
      type: 'scatter3d',
      mode: 'lines',
      name: 'E (электрическое поле)',
      x: data.z,
      y: data.E,
      z: new Array(data.z.length).fill(0),
      line: { color: '#2563eb', width: 5 }
    };

    const traceB = {
      type: 'scatter3d',
      mode: 'lines',
      name: 'B (магнитное поле)',
      x: data.z,
      y: new Array(data.z.length).fill(0),
      z: data.B,
      line: { color: '#dc2626', width: 5 }
    };

    // Зелёные штрихи вдоль z — индикатор направления Пойнтинга
    const traces = [traceE, traceB];
    const nArrows = 8;
    const step = Math.floor(data.z.length / nArrows);
    for (let i = 0; i < nArrows; i++) {
      const idx = i * step;
      const z0 = data.z[idx];
      const z1 = z0 + data.lam * 0.08;
      traces.push({
        type: 'scatter3d',
        mode: 'lines',
        x: [z0, z1],
        y: [0, 0],
        z: [0, 0],
        line: { color: '#16a34a', width: 2 },
        showlegend: false,
        hoverinfo: 'skip'
      });
    }

    const layout = {
      scene: {
        xaxis: { title: 'z (распространение)' },
        yaxis: { title: 'E' },
        zaxis: { title: 'B' },
        aspectmode: 'cube',
        camera: { eye: { x: 1.6, y: -1.6, z: 0.9 } }
      },
      legend: { x: 0.02, y: 0.98, bgcolor: 'rgba(255,255,255,0.85)' },
      margin: { l: 0, r: 0, b: 0, t: 0 },
      paper_bgcolor: 'white',
      plot_bgcolor: 'white'
    };

    Plotly.newPlot('plot', traces, layout, { responsive: true });
    document.getElementById('status').textContent = '';
  } catch (err) {
    document.getElementById('status').textContent = 'Ошибка: ' + err;
    console.error(err);
  }
  btn.disabled = false;
}

main();
</script>
</body>
</html>
