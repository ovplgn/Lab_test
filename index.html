<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Симулятор газа</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f0f0; }
        canvas { background: #e0e0e0; border: 2px solid #333; border-radius: 10px; margin-top: 20px; }
        .controls { margin-top: 20px; }
    </style>
    <!-- Подключаем Pyodide -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
</head>
<body>
    <h2>Симулятор: Нагреваем газ</h2>
    <canvas id="simCanvas" width="400" height="500"></canvas>
    
    <div class="controls">
        <label>Температура (T): <input type="range" id="tempSlider" min="100" max="500" value="300"></label>
        <span id="tempValue">300 K</span>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        
        // Переменные для анимации
        let pistonY = 200; // Позиция поршня (Y)
        let molecules = []; // Массив для молекул

        // Инициализация молекул (просто случайные точки)
        for(let i=0; i<20; i++) {
            molecules.push({x: 50 + Math.random()*300, y: 250 + Math.random()*200, vx: 1, vy: 1});
        }

        async function main() {
            // Загружаем Python
            let pyodide = await loadPyodide();
            await pyodide.loadPackage("numpy");
            const pythonCode = await (await fetch("physics.py")).text();
            await pyodide.runPythonAsync(pythonCode);

            // Слушаем ползунок
            document.getElementById('tempSlider').addEventListener('input', (e) => {
                const T = parseFloat(e.target.value);
                document.getElementById('tempValue').innerText = T + " K";
                
                // Вызываем Python-функцию для расчета позиции поршня
                // Допустим, при T=300 поршень на уровне 200, при T=500 на уровне 100 (выше)
                let newPistonY = pyodide.globals.get("calculate_piston_position")(T);
                pistonY = newPistonY;
            });

            // Запускаем цикл анимации
            animate();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Рисуем цилиндр (стенки)
            ctx.strokeStyle = "#555";
            ctx.lineWidth = 10;
            ctx.beginPath();
            ctx.moveTo(50, 100); // левая стенка
            ctx.lineTo(50, 450);
            ctx.moveTo(350, 100); // правая стенка
            ctx.lineTo(350, 450);
            ctx.stroke();

            // 2. Рисуем газ (область под поршнем)
            ctx.fillStyle = "rgba(173, 216, 230, 0.5)"; // Светло-голубой
            ctx.fillRect(55, pistonY, 290, 450 - pistonY);

            // 3. Рисуем поршень
            ctx.fillStyle = "#333";
            ctx.fillRect(50, pistonY - 15, 300, 15); // Сам поршень
            // Шток поршня
            ctx.fillRect(190, 0, 20, pistonY - 15);

            // 4. Анимация молекул (простое движение)
            ctx.fillStyle = "#0044cc";
            molecules.forEach(m => {
                // Двигаем молекулу
                m.x += m.vx;
                m.y += m.vy;

                // Если вылетела за стенки цилиндра - отталкиваем
                if (m.x < 60 || m.x > 340) m.vx *= -1;
                if (m.y < pistonY + 10 || m.y > 440) m.vy *= -1;

                // Рисуем точку
                ctx.beginPath();
                ctx.arc(m.x, m.y, 3, 0, Math.PI * 2);
                ctx.fill();
            });

            requestAnimationFrame(animate);
        }

        main();
    </script>
</body>
</html>
